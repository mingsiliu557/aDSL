# Remote API from gpu_server_operation_manual.md, section 18.
# Start the SSH tunnel on the experiment host before using this profile:
# ssh -p 11848 -N -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -L 127.0.0.1:28317:127.0.0.1:8318 lms@180.127.11.169
# The API key is in an ignored local file with mode 600.
provider: openai
api: responses
credential:
  file: ../keys/autodl_personal_key.txt
params:
  base_url: http://127.0.0.1:28317/v1
  model: gpt-6-astra
  timeout: 900
  max_retries: 2
  max_tokens: 32768
  parallel_tool_calls: false
  include_usage: true
  trust_env: false
