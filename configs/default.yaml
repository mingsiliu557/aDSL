protocol: snap3d_formula_mujoco_rigid_flex_v2
seed: 42
scale_mm: 150.0
contact: {delta_ratio: 0.005, area_ratio: 0.000015, grid_ratio: 0.001953125}
repair: {}  # trimesh / PyMeshFix closure; interventions recorded.
pge:
  max_loss: 0.35
  wf: 3.0
  wv: 3.0
  ws: 0.5
  # Appendix B specifies local-sliver cleanup, but not its implementation.
  # Our chosen thin-sliver rule: new fragments with mean thickness 2V/A < D/256.
  # This thickness cutoff is our implementation detail, not a published threshold.
  # https://arxiv.org/html/2609.13146 (Appendix B, geometry editing)
  editing_grid_resolution: 256
  sliver_thickness_cells: 1.0
connector: {clearance_ratio: 0.0009765625, overhang_ratio: 0.0029296875, min_radius_ratio: 0.006, min_length_ratio: 0.009765625, head_thickness_ratio: 0.00390625, cone_deg: 55}
rollout:
  # Simulation values: aDSL fabrication_ablation@9e1f01d,
  # benchmark/configs/selection_v1.json physics.standing/material.
  # Integrator and unspecified solver defaults: its assembly_standing.xml_model.
  # SNAP3D retains duration=2, fixed ground, displacement_ratio and rotation_deg.
  collision_backend: rigid_flex
  memory: 1G  # MuJoCo collision workspace; no physics/solver change.
  duration: 2.0
  dt: 0.002
  gravity: 9.81
  density: 1240.0
  friction: [0.5, 0.005, 0.0001]
  integrator: implicitfast
  # Pin parts whose lowest point is within contact delta of the ground.
  ground_ratio: 0.005
  # Soft-contact adaptation, not the IPC intersection-free predicate.
  final_penetration_ratio: 0.00390625  # D/256
  displacement_ratio: 0.05859375
  rotation_deg: 10.0
gate:
  # SNAP3D arXiv:2609.13146v1, Appendix A (Validity check): <0.5 cells.
  # Appendix B (Scale and fixed settings): one cell = D/256.
  # https://arxiv.org/html/2609.13146 (Appendices A and B)
  zero_gravity_displacement_ratio: 0.001953125  # 0.5/256; fixed-body bound remains 1e-4 D.
cem:
  workers: 8  # CPU process pool; sampling/rebuild and result ordering remain serial.
  # 论文为 32/8/3，因计算预算缩减
  population: 8
  elite: 2
  generations: 2
  max_draws: 320
  sigma: [0.01, 0.01, 0.2617993877991494, 0.2617993877991494, 0.002, 0.00390625]
  floor: [0.0005, 0.0005, 0.0174532925199433, 0.0174532925199433, 0.00025, 0.0009765625]
