[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "snap3d-formula-reimplementation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "scipy==1.15.3", "trimesh==5.1.1", "manifold3d==3.5.2", "mujoco==3.16.0", "coacd==1.0.14", "python-fcl==0.7.0.11", "PyYAML", "rtree", "shapely"]
[project.optional-dependencies]
test = ["pytest"]
[tool.setuptools.packages.find]
include = ["snap3d*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
